<style>:root{--bg:#fbfaf7;--fg:#222;--mut:#6b6558;--line:#d9d2c3;--acc:#0a78b5;--box:#f4f1ea}

body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg);max-width:720px;margin:32px auto;padding:0 16px}

<h1>헌금 변환</h1>
<p>은행 거래내역 엑셀을 올리면 디모데 업로드 양식으로 바꿔드립니다.<br><small>변환은 이 컴퓨터 안에서만 이루어지고, 파일은 어디에도 전송·저장되지 않습니다.</small></p>
<label for="f">은행 거래내역 엑셀</label><input id="f" type="file" accept=".xlsx">
<label for="bu">부</label><select id="bu"><option>2부</option><option>3부</option><option selected>4부</option><option>5부</option></select>
<label for="gj">담당자(이름)</label><select id="gj"><option selected>안지원</option><option>백효숙</option><option>김민주</option><option>허미범</option><option>채희경</option><option>이규희</option></select>
<button id="go" disabled>변환기를 준비하는 중… (처음 한 번 20~40초)</button>
<hr><h2>사진으로 변환</h2>
<p><small>거래내역 화면을 캡처하거나 사진을 찍어 올리면 글자를 읽어 표로 보여드립니다. 읽은 결과가 틀릴 수 있으니 표에서 고친 뒤 변환하세요. 사진도 이 컴퓨터 안에서만 처리됩니다.</small></p>
<label for="img">거래내역 사진</label><input id="img" type="file" accept="image/*" multiple>
<button id="ocr" class="sub" disabled>사진 읽기</button><span id="ocrmsg"><small></small></span>
<table id="tb" hidden><thead><tr><th>입금자(기재내용)</th><th>금액</th><th></th></tr></thead><tbody></tbody></table>

const PY=`
import sys, json, io
sys.path.insert(0, "/")
from app.convert import (RULES_PATH, Rules, convert_deposits, read_bank, read_bank_memos, write_upload, write_review)
def run(bu, gj):
    rules = Rules(RULES_PATH)
    rows, date = read_bank("/in.xlsx")
    res = convert_deposits(rows, rules, read_bank_memos("/in.xlsx"))
    write_upload("/up.xlsx", res["records"], rules, gyejeonja=gj, yebae=bu)
    write_review("/rv.xlsx", res["reviews"], res["records"], res["total_count"], res["total_amount"], res["by_item"], res["dup"])
    return json.dumps({"date": date, "count": res["total_count"], "amount": res["total_amount"], "review": res["review_count"]})
def run_rows(rows_json, date, bu, gj):
    rules = Rules(RULES_PATH)
    rows = [(i + 1, str(n).strip(), int(a)) for i, (n, a) in enumerate(json.loads(rows_json))]
    res = convert_deposits(rows, rules)
    write_upload("/up.xlsx", res["records"], rules, gyejeonja=gj, yebae=bu)
    write_review("/rv.xlsx", res["reviews"], res["records"], res["total_count"], res["total_amount"], res["by_item"], res["dup"])
    return json.dumps({"date": date, "count": res["total_count"], "amount": res["total_amount"], "review": res["review_count"]})
`;
const $=id=>document.getElementById(id); let py;
(async()=>{try{
  py=await loadPyodide(); await py.loadPackage("micropip"); await py.runPythonAsync("import micropip; await micropip.install('openpyxl')");
  py.FS.mkdirTree("/app/rules");
  for(const [p,b64] of Object.entries(FILES)){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);py.FS.writeFile("/"+p,u);}
  py.FS.writeFile("/app/__init__.py",""); py.runPython(PY);
  $("go").disabled=false;$("go").textContent="변환";
}catch(e){$("err").textContent="변환기를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요. ("+e+")";}})();
function save(path,name){const d=py.FS.readFile(path);const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([d],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=name;a.className="dl";a.textContent=name+" 받기";return a;}
function show(r){const box=document.createElement("div");box.className="box";
  box.innerHTML="<b>"+r.date+"</b> · "+r.count+"건 · "+r.amount.toLocaleString()+"원 · 검토 "+r.review+"건";
  box.append(save("/up.xlsx","디모데업로드_"+r.date+".xlsx"),save("/rv.xlsx","검토필요_"+r.date+".xlsx"));
  const s=document.createElement("small");s.textContent="받은 파일은 이 컴퓨터에 저장하세요. 화면을 닫으면 다시 받을 수 없습니다.";box.append(s);
  $("out").innerHTML="";$("out").append(box);}
$("go").onclick=async()=>{$("err").textContent="";$("out").innerHTML="";
  const f=$("f").files[0]; if(!f){$("err").textContent="파일을 선택하세요.";return;}
  $("go").disabled=true;
  try{py.FS.writeFile("/in.xlsx",new Uint8Array(await f.arrayBuffer()));
    show(JSON.parse(py.globals.get("run")($("bu").value,$("gj").value)));
  }catch(e){$("err").textContent="파일을 읽을 수 없습니다. 은행 거래내역 엑셀(.xlsx)이 맞는지 확인해 주세요.";console.error(e);}
  $("go").disabled=false;};

/* ---- 사진 → 표 ---- */
const SKIP=new Set(["모바일","인터넷","폰뱅킹","창구","타행","ATM","CMS","스마트","오픈뱅킹","전자금융","이체","입금","펌뱅킹","무통장","대체","자동","기기","텔레뱅킹","체크"]);
function parseOcr(text){
  const rows=[];
  for(let line of text.split(/\r?\n/)){
    line=line.replace(/[|｜]/g," ").replace(/20\d\d\s*[.\-\/]\s*\d{1,2}\s*[.\-\/]\s*\d{1,2}/g," ").replace(/\d{1,2}\s*:\s*\d{2}(\s*:\s*\d{2})?/g," ").trim();
    const m=line.match(/\d{1,3}(?:,\d{3})+/); if(!m) continue;
    const amt=parseInt(m[0].replace(/,/g,""),10); if(!(amt>0)) continue;
    let toks=line.slice(0,m.index).split(/\s+/).filter(Boolean);
    if(toks.length>1&&/^\d{1,4}$/.test(toks[0])) toks.shift();
    toks=toks.filter(t=>!SKIP.has(t));
    const name=toks.join("").replace(/^[^가-힣A-Za-z0-9]+|[^가-힣A-Za-z0-9?)]+$/g,"");
    if(!name) continue;
    rows.push([name,amt]);
  }
  return rows;
}
function addRow(n,a){const tr=document.createElement("tr");
  tr.innerHTML='<td><input class="rn"></td><td><input class="ra" inputmode="numeric"></td><td><button class="sub" style="margin:0">삭제</button></td>';
  tr.querySelector(".rn").value=n;tr.querySelector(".ra").value=a;
  tr.querySelector("button").onclick=()=>tr.remove();$("tb").tBodies[0].append(tr);}
$("addrow").onclick=()=>addRow("","");
$("img").onchange=()=>{$("ocr").disabled=!$("img").files.length;};
let ocrWorker;
$("ocr").onclick=async()=>{$("err").textContent="";$("ocr").disabled=true;const msg=$("ocrmsg").firstChild;
  try{
    msg.textContent=" 글자 인식기를 준비하는 중… (처음 한 번 1분 정도)";
    if(!ocrWorker) ocrWorker=await Tesseract.createWorker(["kor","eng"],1,{logger:m=>{if(m.status==="recognizing text")msg.textContent=" 읽는 중 "+Math.round(m.progress*100)+"%";}});
    let all=[];
    for(const f of $("img").files){const r=await ocrWorker.recognize(f);all=all.concat(parseOcr(r.data.text));}
    $("tb").tBodies[0].innerHTML="";all.forEach(([n,a])=>addRow(n,a));
    $("tb").hidden=false;$("tbbtn").hidden=false;
    msg.textContent=all.length?" "+all.length+"줄을 읽었습니다. 이름·금액이 맞는지 확인하고 고치세요.":" 읽은 줄이 없습니다. 입금 금액(쉼표 포함)이 보이게 더 크고 선명하게 찍어 보세요.";
  }catch(e){$("err").textContent="사진을 읽지 못했습니다. 인터넷 연결을 확인하세요. ("+e+")";}
  $("ocr").disabled=false;};
$("go2").onclick=()=>{$("err").textContent="";
  const rows=[...$("tb").tBodies[0].rows].map(tr=>[tr.querySelector(".rn").value.trim(),parseInt(tr.querySelector(".ra").value.replace(/[^\d]/g,""),10)]).filter(r=>r[0]&&r[1]>0);
  if(!rows.length){$("err").textContent="변환할 줄이 없습니다.";return;}
  try{const d=new Date(),date=""+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    show(JSON.parse(py.globals.get("run_rows")(JSON.stringify(rows),date,$("bu").value,$("gj").value)));
  }catch(e){$("err").textContent="변환 중 오류가 났습니다.";console.error(e);}};
